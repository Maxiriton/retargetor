schema_version = "1.0.0"

id = "retargetor"
version = "0.0.1"
name = "Retargetor"
tagline = "Retarget animation between armatures with different rest poses"
maintainer = "Henri Hebeisen"
# Supported types: "add-on", "theme"
type = "add-on"

# Optional link to documentation, support, source files, etc
# website = "https://extensions.blender.org/add-ons/my-example-package/"

# https://docs.blender.org/manual/en/dev/advanced/extensions/tags.html
tags = ["Animation", "Rigging"]

blender_version_min = "5.1.0"

# License conforming to https://spdx.org/licenses/ (use "SPDX: prefix)
license = [
  "SPDX:GPL-3.0-or-later",
]

# Setups are imported from / exported to JSON files
[permissions]
files = "Import and export retarget setups as JSON"

